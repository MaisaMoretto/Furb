<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício 3</title>
  <style>
    td { border: 1px solid black; padding: 6px 12px; }
    table { border-collapse: collapse; }
  </style>
</head>
<body>
  <h1>Exercício 3</h1>

  <table id="tabela">
    <tr><td>L1 C1</td><td>L1 C2</td><td>L1 C3</td></tr>
    <tr><td>L2 C1</td><td>L2 C2</td><td>L2 C3</td></tr>
    <tr><td>L3 C1</td><td>L3 C2</td><td>L3 C3</td></tr>
  </table>
  <br>
  <button onclick="adicionarLinha()">Adicionar linha</button>

  <script>
    function adicionarLinha() {
      const tabela = document.getElementById("tabela");
      const linha = tabela.insertRow(-1);
      const numero = tabela.rows.length;
      for (let c = 1; c <= 3; c++) {
        const celula = linha.insertCell(-1);
        celula.textContent = "L" + numero + " C" + c;
      }
    }
  </script>
</body>
</html>
