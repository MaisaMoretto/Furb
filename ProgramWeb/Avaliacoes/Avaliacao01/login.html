<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="imagens/Logo.png" alt="Logotipo Patinhas Fofinhas">
            <span>Patinhas Fofinhas</span>
        </a>
        <div id="area-usuario">Usuário não autenticado</div>

                </menu>
            </li>

        <section class="cartao">
            <h1>Login</h1>
            <form action="index.html" method="get">
                <div class="campo">
                    <label for="login">Login</label>
                    <input type="text" id="login" autofocus required>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="botao" onclick="autenticar()">Autenticar</button>
            </form>
        </section>
    </main>
    <footer>
        Integrantes: Maísa Gabriela Moretto, Vinícius de Senna
