<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 2</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h4>
        Página 2
    </h4>
    <p>
        <a href="index.html">Página principal</a>
        <a href="index.html#final">Pág. principal (Google)</a>
        <a href="pagina3.html">Página 3</a>
    </p>
    <p>
        <form action="#" method="get">
            <label for="login">Login: </label>
            <input type="text" name="login" id="login" minlength="5" maxlength="15" autofocus required><br>
            <input type="password" name="senha" minlength="5" placeholder="Informe a senha" required><br>
            <input type="text" name="endereco" placeholder="Informe o endereço" size="100"><br>
            <label for="idade">Idade: </label>
            <input type="number" name="idade" id="idade" min="15" max="110"><br>
            <input type="checkbox" name="conectado" id="conectado" value="S" checked>
            <label for="conectado">Manter conectado</label>
            <p>
                <input type="date" name="data_nasc">
                <input type="time" name="hora" id="">
                <input type="datetime-local" name="data_compl" id=""><br>
                <input type="month" name="mes" id="">
                <input type="week" name="semana" id="">
            </p>
            <h4>Cidade</h4>
            <input type="radio" name="cidade" id="cidade1" value="BNU" checked>
            <label for="cidade1">Blumenau</label>
            <input type="radio" name="cidade" id="cidade2" value="IND">
            <label for="cidade2">Indaial</label>
            <input type="radio" name="cidade" id="cidade3" value="GPR">
            <label for="cidade3">Gaspar</label><br>
            <label for="estado">Estado: </label>
            <select name="estado" id="estado">
                <option value="PR">Paraná</option>
                <option value="SC" selected>Santa Catarina</option>
                <option value="RS">Rio Grande do Sul</option>
            </select><br>
            <textarea name="paragrafo" cols="60" rows="10">Parágrafo de teste.</textarea><br>
            <input type="text" name="campo1" value="Campo1" readonly>
            <input type="text" name="campo2" value="Campo2" disabled>
            <input type="hidden" name="campo3" value="Campo3"><br>
            <input type="text" name="pais" placeholder="Informe país (3 letras)" pattern="[A-Z]{3}">
            <input type="text" name="cpf" placeholder="CPF" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Informe CPF no formato 000.000.000-00"><br>
            <input type="email" name="email" placeholder="Informe e-mail">
            <input type="url" name="url" placeholder="Informe URL"><br>
            <input type="button" value="Clique aqui"><input type="color" name="cor">
            <input type="range" name="range"><br>
            <input type="file" name="arquivo">
            <p>
                <input type="reset" class="classe1" value="Limpar form">
                <input type="submit" value="Enviar dados">
            </p>
        </form>
    </p>
</body>
</html>
